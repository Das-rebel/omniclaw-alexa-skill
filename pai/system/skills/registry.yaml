# PAI Skill Registry
# CODE → CLI → PROMPT → SKILL hierarchy

tiers:
  - name: CODE
    description: Deterministic scripts with explicit logic
    priority: 1
    extensions:
      - .js
      - .py
      - .sh

  - name: CLI
    description: Shell commands and CLI tools
    priority: 2
    extensions:
      - .sh
      - .bash

  - name: PROMPT
    description: Template-based response templates
    priority: 3
    extensions:
      - .md
      - .prompt

  - name: SKILL
    description: LLM-based skills (fallback tier)
    priority: 4
    extensions:
      - .skill.md

# Skill resolution order: CODE → CLI → PROMPT → SKILL
resolution_order:
  - CODE
  - CLI
  - PROMPT
  - SKILL
