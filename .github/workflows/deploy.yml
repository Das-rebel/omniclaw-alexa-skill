name: Deploy OmniClaw

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  deploy-alexa-handler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          project_id: omniclaw-personal-assistant
      
      - name: Deploy alexa-handler
        run: |
          cd infrastructure/cloud-functions/deploy
          gcloud run deploy alexa-handler --source . --region asia-south1

